Templates:
  AMC-Basic-Metadata:
    
    ############################################################
    # 1. IDENTITY (Who/What created the content)
    ############################################################

    # --- Author (The person) ---
    - Name: XMP-AMC:IdentityAuthorID
      Required: true
      Source:
        Type: Variable
        ValueKey: AuthorID

    - Name: XMP-AMC:IdentityAuthorAlias
      Required: true
      Source:
        Type: Variable
        ValueKey: AuthorAlias

    - Name: XMP-AMC:IdentityAuthorName
      Required: true
      Source:
        Type: Variable
        ValueKey: AuthorName

    # --- Device (The hardware) ---
    - Name: XMP-AMC:IdentityDeviceID
      Required: true
      Source:
        Type: Variable
        ValueKey: DeviceID

    - Name: XMP-AMC:IdentityDeviceAlias
      Required: true
      Source:
        Type: Variable
        ValueKey: DeviceAlias

    - Name: XMP-AMC:IdentityDeviceName
      Required: true
      Source:
        Type: Variable
        ValueKey: DeviceName

    - Name: XMP-AMC:IdentityDeviceSerialNumber
      Required: false
      Source:
        Type: Variable
        ValueKey: DeviceSerialNumber
        
    ############################################################
    # 2. ORIGIN (The immutable "backup" of the original state)
    ############################################################
    
    - Name: XMP-AMC:OriginOriginalFileName
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalFileName

    - Name: XMP-AMC:OriginOriginalDateTime
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: XMP-AMC:OriginOriginalSubseconds
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalSubseconds
        
    ############################################################
    # 5. STANDARD TAGS SYNC (Industry Compatibility & DATE PERSISTENCE)
    ############################################################

    # --- 5.1 DATE PERSISTENCE (Conditional) ---
    
    # Tags EXIF (Solo para Fotos)
    - Name: ExifIFD:DateTimeOriginal
      Required: true
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: ExifIFD:CreateDate
      Required: true
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: ExifIFD:ModifyDate
      Required: true
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime

    # Tags QuickTime/Keys (Solo para Videos)
    - Name: QuickTime:DateTimeOriginal
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: QuickTime:CreateDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: QuickTime:MediaCreateDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: QuickTime:TrackCreateDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime
        
    - Name: Keys:CreationDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime
        
    - Name: QuickTime:ModifyDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: QuickTime:MediaModifyDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: QuickTime:TrackModifyDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime
        
    # --- 5.2 Standard Sync (Universal) ---
    
    - Name: XMP-dc:Creator
      Required: true
      Source: 
        Type: Variable
        ValueKey: AuthorName

    - Name: XMP-xmpMM:PreservedFileName
      Required: true
      Source: 
        Type: Variable
        ValueKey: OriginalFileName

  AMC-WOF-Ingest:
    
    ############################################################
    # 1. IDENTITY (Who/What created the content)
    ############################################################

    # --- Author (The person) ---
    - Name: XMP-AMC:IdentityAuthorID
      Required: true
      Source: 
        Type: Variable
        ValueKey: AuthorID 

    - Name: XMP-AMC:IdentityAuthorAlias
      Required: true
      Source: 
        Type: Variable
        ValueKey: AuthorAlias

    - Name: XMP-AMC:IdentityAuthorName
      Required: true
      Source: 
        Type: Variable
        ValueKey: AuthorName

    # --- Device (The hardware) ---
    - Name: XMP-AMC:IdentityDeviceID
      Required: true
      Source: 
        Type: Variable
        ValueKey: DeviceID

    - Name: XMP-AMC:IdentityDeviceAlias
      Required: true
      Source: 
        Type: Variable
        ValueKey: DeviceAlias

    - Name: XMP-AMC:IdentityDeviceName
      Required: true
      Source: 
        Type: Variable
        ValueKey: DeviceName
        
    ############################################################
    # 2. ORIGIN (The immutable "backup" of the original state)
    ############################################################
    
    - Name: XMP-AMC:OriginOriginalFileName
      Required: true
      Source: 
        Type: Variable
        ValueKey: OriginalFileName 

    - Name: XMP-AMC:OriginOriginalDateTime
      Required: true
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime 

    - Name: XMP-AMC:OriginOriginalSubseconds
      Required: false
      Source: 
        Type: Variable
        ValueKey: OriginalSubseconds

    ############################################################
    # 3. WORKFLOW (What processing has been applied)
    ############################################################

    - Name: XMP-AMC:WorkflowIngestDerivedFileName
      Required: false
      Source: 
        Type: Variable
        ValueKey: DerivedFileName

    - Name: XMP-AMC:WorkflowIngestDerivedFolderPath
      Required: false
      Source: 
        Type: Variable
        ValueKey: DerivedFolderPath

    ############################################################
    # 4. EVENT (What the content is about)
    ############################################################
    - Name: XMP-AMC:EventName
      Required: false
      Source: 
        Type: Variable
        ValueKey: MyAlbum 
        
    ############################################################
    # 5. STANDARD TAGS SYNC (Industry Compatibility)
    ############################################################
    
    # --- Standard Author ---
    - Name: XMP-dc:Creator
      Required: true
      Source: 
        Type: Variable
        ValueKey: AuthorName

    - Name: XMP-xmpMM:PreservedFileName
      Required: true
      Source: 
        Type: Variable
        ValueKey: OriginalFileName
