Templates:
  AMC-Basic-Metadata:
    
    ############################################################
    # 1. IDENTITY (Who/What created the content)
    ############################################################

    # --- Author (The person) ---
    - Name: XMP-AMC:IdentityAuthorID
      Required: true
      Source:
        Type: Variable
        ValueKey: AuthorID

    - Name: XMP-AMC:IdentityAuthorAlias
      Required: true
      Source:
        Type: Variable
        ValueKey: AuthorAlias

    - Name: XMP-AMC:IdentityAuthorName
      Required: true
      Source:
        Type: Variable
        ValueKey: AuthorName

    # --- Device (The hardware) ---
    - Name: XMP-AMC:IdentityDeviceID
      Required: true
      Source:
        Type: Variable
        ValueKey: DeviceID

    - Name: XMP-AMC:IdentityDeviceAlias
      Required: true
      Source:
        Type: Variable
        ValueKey: DeviceAlias

    - Name: XMP-AMC:IdentityDeviceName
      Required: true
      Source:
        Type: Variable
        ValueKey: DeviceName

    - Name: XMP-AMC:IdentityDeviceSerialNumber
      Required: false
      Source:
        Type: Variable
        ValueKey: DeviceSerialNumber
        
    ############################################################
    # 2. ORIGIN (The immutable "backup" of the original state)
    ############################################################

    - Name: XMP-AMC:OriginOriginalFileName
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalFileName

    - Name: XMP-AMC:OriginOriginalDateTime
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalDateTime

    - Name: XMP-AMC:OriginOriginalDateTimeLocal
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalDateTimeLocal

    - Name: XMP-AMC:OriginOriginalDateTimeUTC
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalDateTimeUTC

    - Name: XMP-AMC:OriginOriginalTimeZoneOffset
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalTimeZoneOffset

    - Name: XMP-AMC:OriginOriginalSubseconds
      Required: true
      Source:
        Type: Variable
        ValueKey: OriginalSubseconds
        
    ############################################################
    # 5. STANDARD TAGS SYNC (Industry Compatibility & DATE PERSISTENCE)
    ############################################################

    # --- 5.1 PHOTO PERSISTENCE (EXIF Standard) ---
    # Para fotos, el estándar manda usar la hora local sin offset en estos tags.

    - Name: ExifIFD:DateTimeOriginal
      Required: true
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeLocal

    - Name: ExifIFD:CreateDate
      Required: true
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeLocal

    - Name: ExifIFD:ModifyDate
      Required: true
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeLocal

    # --- 5.2 VIDEO PERSISTENCE (Triple-Layer Curation) ---
    # Aplicamos la heurística para que el video se vea bien en todas las plataformas.

    # LAYER A: Modern Visuals (Local + Offset) - Para Google/Apple Photos
    - Name: Keys:CreationDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime        # Ej: 2024:04:22 17:53:18+02:00
      Overwrite: true

    - Name: ItemList:ContentCreateDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime
      Overwrite: true

    # LAYER B: Legacy Compatibility (Local)
    - Name: UserData:DateTimeOriginal
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime   # Ej: 2024:04:22 17:53:18
      Overwrite: true

    # LAYER C: ISO Standard (Strict UTC) - Para consistencia interna del contenedor
    - Name: QuickTime:CreateDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeUTC_NoZ # Ej: 2024:04:22 15:53:18
      Overwrite: true

    - Name: QuickTime:ModifyDate
      Required: true
      AssetType: Video
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeUTC_NoZ
      Overwrite: true

    # Tags de Media y Track (Sincronizados en UTC)
    - Name: QuickTime:MediaCreateDate
      Required: true
      AssetType: Video
      WriteTag: QuickTime:MediaCreateDate
      ReadTag: Composite:MyMediaCreateDate
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeUTC_NoZ
      Overwrite: true

    - Name: QuickTime:TrackCreateDate
      Required: true
      AssetType: Video
      WriteTag: QuickTime:TrackCreateDate
      ReadTag: Composite:MyTrackCreateDate
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeUTC_NoZ
      Overwrite: true

    - Name: QuickTime:MediaModifyDate
      Required: true
      AssetType: Video
      WriteTag: QuickTime:MediaModifyDate
      ReadTag: Composite:MyMediaModifyDate
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeUTC_NoZ
      Overwrite: true

    - Name: QuickTime:TrackModifyDate
      Required: true
      AssetType: Video
      WriteTag: QuickTime:TrackModifyDate
      ReadTag: Composite:MyTrackModifyDate
      Source: 
        Type: Variable
        ValueKey: OriginalDateTimeUTC_NoZ
      Overwrite: true

    # --- 5.3 XMP STANDARDS (Global Sync) ---
    # Estos tags aseguran que softwares como Lightroom o Adobe Bridge vean la fecha correcta con Offset.

    - Name: XMP-exif:DateTimeOriginal
      Required: true
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime
      Overwrite: true

    - Name: XMP-xmp:CreateDate
      Required: true
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime
      Overwrite: true

    - Name: XMP-xmp:ModifyDate
      Required: true
      Source: 
        Type: Variable
        ValueKey: OriginalDateTime
      Overwrite: true

    # --- 5.4 TIMEZONE & LOCATION (Context Anchor - Heuristics 1 & 2) ---

    # Offsets para Fotos (EXIF)
    - Name: ExifIFD:OffsetTimeOriginal
      Required: false
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalTimeZoneOffset  # Ej: "+02:00"

    - Name: ExifIFD:OffsetTime
      Required: false
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalTimeZoneOffset

    - Name: ExifIFD:OffsetTimeDigitized
      Required: false
      AssetType: Photo
      Source: 
        Type: Variable
        ValueKey: OriginalTimeZoneOffset
        
    # --- 5.5 Standard Sync (Universal) ---
    
    - Name: XMP-dc:Creator
      Required: true
      Source: 
        Type: Variable
        ValueKey: AuthorName

    - Name: XMP-xmpMM:PreservedFileName
      Required: true
      Source: 
        Type: Variable
        ValueKey: OriginalFileName

